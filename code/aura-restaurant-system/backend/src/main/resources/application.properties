spring.application.name=aura-backend

# Database Configuration (Docker)
spring.datasource.url=jdbc:postgresql://postgres:5432/aura_db
spring.datasource.username=aura_user
spring.datasource.password=aura_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security
jwt.secret=MySuperSecretKeyForAuraProject1234567890

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PayHere Configuration
payhere.merchant.id=1236299
payhere.merchant.secret=MzI0NDA5MjcxOTMzNzcwNDU3MzYyOTY5MzU4ODk0NDA0MjQ1MzI2NA==
payhere.sandbox=true

# Flyway — skip validation so missing intermediate scripts (V1,V2,V4-V7) in flyway_schema_history don't crash startup
spring.flyway.validate-on-migrate=false