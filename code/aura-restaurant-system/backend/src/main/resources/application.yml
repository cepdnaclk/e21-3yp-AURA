spring:
  application:
    name: aura-backend

  # ── Database ──────────────────────────────────────────────
  # Local: .env / IDE defaults | Docker & Prod: env_file වලින් එනවා
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aura_db}
    username: ${DB_USERNAME:aura_user}
    password: ${DB_PASSWORD:aura_password}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      # update = Hibernate තමන්ම schema එක maintain කරනවා (දැන් වැඩ කරන විදිහ)
      # validate = Flyway scripts complete උනාම මේකට මාරු වෙන්න
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${JPA_SHOW_SQL:true}

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false   # missing V1,V2,V4-V7 scripts crash වෙන්නේ නැති වෙන්න

  # ── File Upload (Cloudinary සඳහා) ─────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# ── JWT ─────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiry: 86400000

# ── Cloudinary ──────────────────────────────────────────────
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ── PayHere ─────────────────────────────────────────────────
payhere:
  merchant:
    id: ${PAYHERE_MERCHANT_ID}
    secret: ${PAYHERE_MERCHANT_SECRET}
  sandbox: ${PAYHERE_SANDBOX:true}

# ── Gemini ──────────────────────────────────────────────────
gemini:
  api-key: ${GEMINI_API_KEY}

# ── MQTT ────────────────────────────────────────────────────
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  broker: ${MQTT_BROKER:localhost}
  port: ${MQTT_PORT:1883}

# ── Swagger ─────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs