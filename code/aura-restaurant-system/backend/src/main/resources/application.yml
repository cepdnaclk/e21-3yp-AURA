spring:
  application:
    name: aura-restaurant-system

  # ── Database ────────────────────────────────────────────────────────────────
  datasource:
    # Docker environment variables හරහා අගයන් නොලැබුණහොත් ක්‍රියාත්මක වන Fallback අගයන්:
    url: ${DB_URL:jdbc:postgresql://aura-db-instance.c1goeg2quej5.ap-south-1.rds.amazonaws.com:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:'aura-database-pwd#17'}  # මෙහි Quotes යෙදීම අනිවාර්ය වේ
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # ── Flyway (Database Migrations) ────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

  # ── File Upload Limits ──────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 50MB      # Maximum file size per upload
      max-request-size: 50MB   # Maximum request size (including multiple files)

# ── JWT (Authentication Tokens) ─────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiry: 86400000

# ── Swagger UI (API Documentation) ──────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs