<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Voice Agent - Test Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Order Tracker & Menu Browser -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>AURA Dashboard</h2>
                <span class="badge">Test Mode</span>
            </div>

            <!-- Table Info -->
            <div class="panel table-panel">
                <div class="panel-header">
                    <h3>Table Context</h3>
                    <select id="tableSelect">
                        <option value="1">Table 1</option>
                        <option value="2">Table 2</option>
                        <option value="3">Table 3</option>
                    </select>
                </div>
            </div>

            <!-- Order Tracker -->
            <div class="panel order-panel">
                <div class="panel-header">
                    <h3>Current Order</h3>
                    <button id="resetBtn" class="icon-btn" title="Reset Session">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
                <div class="order-items" id="orderItems">
                    <!-- Order items injected here -->
                    <div class="empty-state">No items added yet.</div>
                </div>
                <div class="order-total">
                    <span>Total:</span>
                    <span class="price" id="orderTotal">Rs 0.00</span>
                </div>
            </div>

            <!-- Menu Browser -->
            <div class="panel menu-panel">
                <div class="panel-header">
                    <h3>Live Menu (DB)</h3>
                    <button id="refreshMenuBtn" class="icon-btn" title="Refresh">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                    </button>
                </div>
                <div class="menu-items" id="menuList">
                    <!-- Menu items injected here -->
                    <div class="loading-state">Loading...</div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <div class="chat-header">
                <div class="avatar aura-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
                </div>
                <div class="header-info">
                    <h2>AURA Voice Assistant</h2>
                    <p>Connected to database via REST API</p>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <!-- Messages injected here -->
                <div class="message aura-message">
                    <div class="bubble">Hi! I'm AURA. What would you like to order today?</div>
                </div>
            </div>

            <div class="chat-input-area">
                <form id="chatForm">
                    <input type="text" id="messageInput" placeholder="Type a message (e.g. 'I want a chicken burger')" autocomplete="off" required>
                    <button type="submit" class="send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
